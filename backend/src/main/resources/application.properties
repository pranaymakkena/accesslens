# AccessLens API Configuration

# Server
server.port=8081

# Scanner service URL
accesslens.scanner.url=http://localhost:3001

# CORS allowed origins (comma-separated for production)
accesslens.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Scan timeouts (milliseconds)
accesslens.scan.timeout-ms=60000
accesslens.scan.max-concurrent=3

# In-memory store: max scan results to keep (to prevent OOM)
accesslens.store.max-size=100

# WebClient buffer size (10MB to handle large HTML responses from scanned websites)
spring.codec.max-in-memory-size=10485760

# ── Neo4j Graph Database ──────────────────────────────────────────────────
# Point to your local or cloud Neo4j instance.
# Free community edition: https://neo4j.com/download/
# AuraDB free tier:        https://neo4j.com/cloud/platform/aura-graph-database/
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=accesslens

# Auto-index WCAG and DomElement nodes on startup
spring.data.neo4j.schema-generate=create_or_validate

# Logging
logging.level.com.accesslens=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.neo4j=WARN
